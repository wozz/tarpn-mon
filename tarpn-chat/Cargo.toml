[package]
name = "tarpn-chat"
version = "1.6.1"
edition = "2024"
description = "LinBPQ-compatible chat node implementation"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Time handling
chrono = "0.4"

# WebSocket support for client API
tokio-tungstenite = "0.24"
futures-util = "0.3"

# JSON serialization
serde_json = "1"

# Prometheus metrics
prometheus = { version = "0.13", default-features = false }
lazy_static = "1"
