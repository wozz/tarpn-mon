; Node 5 - TEST5-1 (tarpn-chat node)
; Connects to: node4 (TEST4-1)
; Also receives connection from: node7 (TEST7-1)

SIMPLE
NODECALL=TEST5-1
NODEALIAS=NODE5
LOCATOR=NONE
BTINTERVAL=30
MINQUAL=50
NODESINTERVAL=1

; Enable Mail (but NOT built-in chat - we use tarpn-chat)
LINMAIL

; tarpn-chat connects as a NetROM node via NETROMPORT
; Users connect directly: C TEST5-9
; The chat callsign becomes routable when tarpn-chat connects

; AXUDP port to Node 4 (tarpn-chat hub)
PORT
PORTNUM=1
ID=Link to NODE4
DRIVER=BPQAXIP
QUALITY=192
MAXFRAME=4
FRACK=5000
RESPTIME=1000
RETRIES=10
PACLEN=236
CONFIG
UDP 10096
MAP TEST4-1 172.20.0.5 UDP 10096 B
BROADCAST QST-0
BROADCAST NODES-0
DONTCHECKSOURCECALL
ENDPORT

; AXUDP port to Node 7 (LinBPQ)
PORT
PORTNUM=2
ID=Link to NODE7
DRIVER=BPQAXIP
QUALITY=192
MAXFRAME=4
FRACK=5000
RESPTIME=1000
RETRIES=10
PACLEN=236
CONFIG
UDP 10098
MAP TEST7-1 172.20.0.8 UDP 10098 B
BROADCAST QST-0
BROADCAST NODES-0
DONTCHECKSOURCECALL
ENDPORT

; Telnet server with NETROMPORT for tarpn-chat NetROM connection
; PORTNUM=32 is TARPN's standard convention for telnet port
PORT
PORTNUM=32
ID=Telnet Server
DRIVER=TELNET
CONFIG
LOGGING=1
TCPPORT=8010
FBBPORT=0
HTTPPORT=8080
NETROMPORT=63119
LOGINPROMPT=Callsign:
PASSWORDPROMPT=Password:
LOCALECHO=1
USER=SYSOP,test,SYSOP,,SYSOP
USER=ALICE,test,ALICE,,
USER=BOB,test,BOB,,
USER=CAROL,test,CAROL,,
USER=DAN,test,DAN,,
ENDPORT

ROUTES:
TEST4-1,192,1
TEST7-1,192,2
CALL=TEST5-9,QUALITY=200,PORT=32,TCP=0.0.0.0:63119
