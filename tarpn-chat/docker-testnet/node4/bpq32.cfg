; Node 4 - TEST4-1 (Custom Chat Node - HUB for extended network)
; Connects to: node2 (TEST2-1), node5 (TEST5-1), node6 (TEST6-1)
; Uses tarpn-chat instead of built-in chat

SIMPLE
NODECALL=TEST4-1
NODEALIAS=NODE4
LOCATOR=NONE
BTINTERVAL=30
MINQUAL=50
NODESINTERVAL=1

; Enable Mail (but NOT built-in chat - we use external)
LINMAIL

; tarpn-chat connects as a NetROM node via NETROMPORT
; Route is configured via BPQNODES.dat with NODE ADD
; Users connect directly: C TEST4-9
; The chat callsign becomes routable when tarpn-chat connects

; AXUDP port to Node 2 (original hub)
PORT
PORTNUM=1
ID=Link to NODE2
DRIVER=BPQAXIP
QUALITY=192
MAXFRAME=4
FRACK=5000
RESPTIME=1000
RETRIES=10
PACLEN=236
CONFIG
UDP 10095
MAP TEST2-1 172.20.0.3 UDP 10095 B
BROADCAST QST-0
BROADCAST NODES-0
DONTCHECKSOURCECALL
ENDPORT

; AXUDP port to Node 5 (tarpn-chat)
PORT
PORTNUM=2
ID=Link to NODE5
DRIVER=BPQAXIP
QUALITY=192
MAXFRAME=4
FRACK=5000
RESPTIME=1000
RETRIES=10
PACLEN=236
CONFIG
UDP 10096
MAP TEST5-1 172.20.0.6 UDP 10096 B
BROADCAST QST-0
BROADCAST NODES-0
DONTCHECKSOURCECALL
ENDPORT

; AXUDP port to Node 6 (LinBPQ)
PORT
PORTNUM=3
ID=Link to NODE6
DRIVER=BPQAXIP
QUALITY=192
MAXFRAME=4
FRACK=5000
RESPTIME=1000
RETRIES=10
PACLEN=236
CONFIG
UDP 10097
MAP TEST6-1 172.20.0.7 UDP 10097 B
BROADCAST QST-0
BROADCAST NODES-0
DONTCHECKSOURCECALL
ENDPORT

; Telnet server with NETROMPORT for tarpn-chat NetROM connection
; PORTNUM=32 is TARPN's standard convention for telnet port
PORT
PORTNUM=32
ID=Telnet Server
DRIVER=TELNET
CONFIG
LOGGING=1
TCPPORT=8010
FBBPORT=0
HTTPPORT=8080
NETROMPORT=63119
LOGINPROMPT=Callsign:
PASSWORDPROMPT=Password:
LOCALECHO=1
USER=SYSOP,test,SYSOP,,SYSOP
USER=ALICE,test,ALICE,,
USER=BOB,test,BOB,,
USER=CAROL,test,CAROL,,
USER=DAN,test,DAN,,
ENDPORT

ROUTES:
TEST2-1,192,1
TEST5-1,192,2
TEST6-1,192,3
CALL=TEST4-9,QUALITY=200,PORT=32,TCP=0.0.0.0:63119
