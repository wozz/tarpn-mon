NAME=tarpn-chat
SUMMARY=NetROM chat server (replaces LinBPQ built-in LINCHAT)
VERSION=1
REQUIRES=core
UNITS=tarpn-chat.service
ENABLE=tarpn-chat.service
REQUIRED=false
BINARY=tarpn-chat
PROVIDES=chat

# Installing this switches CHAT_PROVIDER in node.conf to tarpn-chat, which
# turns off LinBPQ's built-in LINCHAT and enables NETROMPORT. Removing it
# switches back. See hooks/postinstall and hooks/preremove.
