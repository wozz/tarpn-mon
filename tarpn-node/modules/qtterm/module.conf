NAME=qtterm
SUMMARY=QtTermTCP terminal on the node's desktop (for VNC/local users)
VERSION=1
REQUIRES=core
# Deliberately no UNITS: this is a desktop application a person launches, not
# a service. The module installs the binary and a menu entry and stops there.
UNITS=
ENABLE=
REQUIRED=false
PROVIDES=terminal

# The stock TARPN installer puts a 32-bit QtTermTCP on the Pi desktop, which
# is why it stops working on a 64-bit image. G8BPQ publishes a build per
# architecture; this module installs the right one.
#
# Only needed if someone uses the node's own desktop, over VNC or a monitor.
# Running QtTermTCP on another machine and pointing it at this node over the
# network needs nothing installed here.
