NAME=node-commands
SUMMARY=Node helper commands (TRR, TINFO, LINKTEST, LINUX) over socket activation
VERSION=1
REQUIRES=core
UNITS=tarpn-cmd-trr.socket tarpn-cmd-trr@.service tarpn-cmd-tinfo.socket tarpn-cmd-tinfo@.service tarpn-cmd-linktest.socket tarpn-cmd-linktest@.service tarpn-cmd-linux.socket tarpn-cmd-linux@.service
# Only the sockets are enabled; each pulls in its @.service per connection.
ENABLE=tarpn-cmd-trr.socket tarpn-cmd-tinfo.socket tarpn-cmd-linktest.socket tarpn-cmd-linux.socket
REQUIRED=false
PROVIDES=node-commands
BINARY=linktest

# These replace the legacy inetd entries in custom-bpq-commands-inetd.004.
# LinBPQ connects out to a CMDPORT socket; systemd accepts the connection and
# runs the handler with stdin/stdout wired to it - exactly inetd's
# "stream tcp nowait" semantics, without inetd.
#
# CMDPORT index -> port -> command (fixed by the bpq32.cfg CMDPORT line):
#   HOST 0  63000  trr
#   HOST 1  63001  linux
#   HOST 2  63002  tchat     (not served; superseded by the tarpn-chat module)
#   HOST 3  63003  tinfo
#   HOST 4  63004  linktest
