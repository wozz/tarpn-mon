NAME=hostmode
SUMMARY=Terminal into this node from its own console (HOST mode)
VERSION=1
REQUIRES=core
# No units: this is a terminal a person opens, not a service.
UNITS=
ENABLE=
REQUIRED=false
PROVIDES=host-console

# The stock TARPN equivalent is `tarpn host`, which runs piminicom - stock
# minicom plus a one-line patch that plays a sound file on the terminal bell -
# against /home/pi/minicom/com8. Only a 32-bit ARM build of that binary is
# published, so it stops working on a 64-bit image.
#
# This uses stock minicom from Debian, which does everything except turn the
# bell into an audible chime, and puts the console device in BPQ_HOME instead
# of /home/pi.
