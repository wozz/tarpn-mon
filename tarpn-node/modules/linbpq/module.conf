NAME=linbpq
SUMMARY=LinBPQ AX.25/NetROM engine and bpq32.cfg generation
VERSION=1
REQUIRES=core
UNITS=tarpn-linbpq.service
ENABLE=tarpn-linbpq.service
REQUIRED=false

# This module owns the "node engine" role described in docs/INTERFACES.md.
# To run a different implementation, disable this module and provide a unit
# that offers the same telnet/monitor/NetROM endpoints:
#   tarpnctl disable linbpq
PROVIDES=node-engine
