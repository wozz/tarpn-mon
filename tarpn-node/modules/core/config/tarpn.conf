# /etc/tarpn/tarpn.conf - installation-wide settings.
#
# This file describes the *installation*. Radio and node configuration lives
# in /etc/tarpn/node.conf instead.
#
# Installed once and never overwritten by updates. Safe to edit; run
# `tarpnctl apply` afterwards.

# Account that owns node data and runs the services. On a stock TARPN box this
# is `pi`. The user must be in the `dialout` group to reach USB TNCs.
TARPN_USER=pi

# Where LinBPQ (or a replacement) runs. bpq32.cfg is generated into this
# directory; BPQNODES.dat and the BBS spool live here too.
BPQ_HOME=/var/lib/tarpn/bpq

# Release channel used by `tarpnctl update` for binary modules.
RELEASE_BASE_URL=https://tarpn-terminal.s3.us-east-1.amazonaws.com
RELEASE_VERSION=latest

# Where the linbpq binary comes from. LinBPQ is third-party software and is
# not redistributed here; "auto" downloads the build matching this machine's
# userland from G8BPQ's own download area, which is where the stock TARPN
# installer gets it too.
#
#   auto            pick by architecture (see below) and download
#   <url>           download from a specific URL
#   /path/to/file   copy from a local file
#   none            do not fetch; install it yourself
#
# The published builds, by userland:
#   arm32 (armhf)   .../Beta/pilinbpq
#   arm64 (aarch64) .../Beta/pilinbpq64
#   amd64 (x86-64)  .../Beta/linbpq64
#
# Whatever arrives is checked to be an ELF of the right architecture before it
# replaces a working binary.
LINBPQ_SOURCE=auto
