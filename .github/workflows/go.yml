# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.5'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: tarpn-terminal/package-lock.json

    - name: Install JS dependencies
      run: |
        cd tarpn-terminal
        npm ci

    - name: Build JS
      run: |
        cd tarpn-terminal
        npx expo export -p web
        cd ..
        mv tarpn-terminal/dist web-dist

    - name: Test Go
      run: go test -v ./...

    - name: Build Go
      run: GOOS=linux GOARCH=arm go build -ldflags "-X main.Version=${{ github.ref_name }}" -o tarpn-mon.linux-arm32 -v .

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          tarpn-mon.linux-arm32
